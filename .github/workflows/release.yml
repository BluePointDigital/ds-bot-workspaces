name: Workspace bridge release

# Deliberately no npm publish or OIDC publishing permission in this fork.
on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: workspace-bridge-release
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
        working-directory: ds-bot
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify fork identity and tag
        env:
          TAG: ${{ github.event.release.tag_name }}
          REPOSITORY: ${{ github.repository }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          node --input-type=module - <<'JS'
          import { readFileSync } from 'node:fs'
          const pkg = JSON.parse(readFileSync('package.json'))
          if (pkg.private !== true) throw new Error('Fork must prohibit npm publication')
          if (process.env.TAG !== `v${pkg.version}`) throw new Error('Tag/version mismatch')
          const url = `https://github.com/${process.env.REPOSITORY}.git`
          if (pkg.repository.url !== `git+${url}`) throw new Error('Set the actual fork repository metadata before releasing')
          if (!pkg.version.includes('-workspaces.')) throw new Error('Expected workspace fork version')
          if (process.env.PRERELEASE !== 'true') throw new Error('Workspace candidate must be published as a prerelease, not a production release')
          if (process.env.REPOSITORY.toLowerCase() === 'fei2411/deepseek-bot') throw new Error('Refusing candidate release in upstream repository')
          JS
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - run: npm ci --no-fund --no-audit
      - run: npm run harness
      - run: npm test
      - run: node scripts/build-client.mjs --check
      - run: npm run lint
      - name: Scan committed source
        working-directory: .
        run: |
          mkdir -p "$RUNNER_TEMP/source-scan"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/source-scan"
          node scripts/scan.mjs "$RUNNER_TEMP/source-scan"
      - name: Pack, inspect and checksum
        run: |
          npm pack --ignore-scripts
          archive="ds-bot-$(node -p "require('./package.json').version").tgz"
          mkdir -p "$RUNNER_TEMP/package-scan"
          tar -xzf "$archive" -C "$RUNNER_TEMP/package-scan"
          node ../scripts/scan.mjs "$RUNNER_TEMP/package-scan/package" --package
          sha256sum "$archive" > SHA256SUMS
      - name: Attach verified build assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG" "ds-bot-$(node -p "require('./package.json').version").tgz" SHA256SUMS
